<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EduStar — Your AI Tutor</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════════
   THEME TOKENS — dark/light
   All LiveKit vars flow from .env via server.py
═══════════════════════════════════════════════ */
:root {
  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
  --ease-out: cubic-bezier(0.22,1,0.36,1);
  --font-main: 'Sora', sans-serif;
  --font-hand: 'Caveat', cursive;
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --radius-xl: 40px;
}

[data-theme="dark"] {
  --bg-base:      #080b14;
  --bg-layer1:    #0e1422;
  --bg-layer2:    #141c30;
  --bg-layer3:    #1a2340;
  --border:       rgba(99,136,255,0.15);
  --border-glow:  rgba(99,136,255,0.4);
  --text-primary: #eef2ff;
  --text-secondary:#8b9fd4;
  --text-muted:   #4a5a8a;
  --accent1:      #6388ff;
  --accent2:      #a78bfa;
  --accent3:      #34d399;
  --accent4:      #fb923c;
  --accent5:      #f472b6;
  --user-bubble:  linear-gradient(135deg,#6388ff,#a78bfa);
  --agent-bubble: linear-gradient(135deg,#1a2340,#1e2b48);
  --agent-border: rgba(99,136,255,0.3);
  --btn-ask:      linear-gradient(135deg,#6388ff 0%,#a78bfa 100%);
  --btn-stop:     linear-gradient(135deg,#f472b6 0%,#fb923c 100%);
  --star-color:   #6388ff;
  --nebula1:      rgba(99,136,255,0.06);
  --nebula2:      rgba(167,139,250,0.05);
  --nebula3:      rgba(52,211,153,0.04);
  --glow-accent:  0 0 40px rgba(99,136,255,0.25);
  --card-bg:      rgba(14,20,34,0.8);
  --header-bg:    rgba(8,11,20,0.9);
  --input-bg:     rgba(20,28,48,0.9);
  --theme-icon:   "☀️";
}

[data-theme="light"] {
  --bg-base:      #f0f4ff;
  --bg-layer1:    #ffffff;
  --bg-layer2:    #f8faff;
  --bg-layer3:    #eef2ff;
  --border:       rgba(99,136,255,0.2);
  --border-glow:  rgba(99,136,255,0.5);
  --text-primary: #1a1f3a;
  --text-secondary:#4a5a8a;
  --text-muted:   #8b9fd4;
  --accent1:      #4f72f5;
  --accent2:      #7c3aed;
  --accent3:      #059669;
  --accent4:      #ea580c;
  --accent5:      #db2777;
  --user-bubble:  linear-gradient(135deg,#4f72f5,#7c3aed);
  --agent-bubble: linear-gradient(135deg,#ffffff,#f0f4ff);
  --agent-border: rgba(99,136,255,0.25);
  --btn-ask:      linear-gradient(135deg,#4f72f5 0%,#7c3aed 100%);
  --btn-stop:     linear-gradient(135deg,#db2777 0%,#ea580c 100%);
  --star-color:   #c7d2fe;
  --nebula1:      rgba(99,136,255,0.08);
  --nebula2:      rgba(124,58,237,0.06);
  --nebula3:      rgba(5,150,105,0.05);
  --glow-accent:  0 4px 32px rgba(79,114,245,0.18);
  --card-bg:      rgba(255,255,255,0.85);
  --header-bg:    rgba(240,244,255,0.92);
  --input-bg:     rgba(255,255,255,0.95);
  --theme-icon:   "🌙";
}

/* ─── Reset ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:var(--font-main);}

body {
  background: var(--bg-base);
  color: var(--text-primary);
  transition: background 0.4s var(--ease-out), color 0.4s var(--ease-out);
}

/* ─── Star field background ─── */
.starfield {
  position: fixed; inset: 0; z-index: 0;
  overflow: hidden; pointer-events: none;
}
.star {
  position: absolute;
  border-radius: 50%;
  background: var(--star-color);
  animation: starPulse ease-in-out infinite;
}
@keyframes starPulse {
  0%,100%{opacity:0.2;transform:scale(1);}
  50%{opacity:0.9;transform:scale(1.5);}
}

/* nebula blobs */
.nebula {
  position: fixed; border-radius: 50%;
  filter: blur(80px); pointer-events: none; z-index: 0;
  transition: background 0.5s;
}
.nebula-1{width:600px;height:600px;top:-100px;left:-100px;background:var(--nebula1);}
.nebula-2{width:500px;height:500px;top:30%;right:-120px;background:var(--nebula2);}
.nebula-3{width:400px;height:400px;bottom:-80px;left:20%;background:var(--nebula3);}

/* ─── App shell ─── */
.app {
  position: relative; z-index: 10;
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh;
  max-width: 860px;
  margin: 0 auto;
  padding: 0 16px;
}

/* ════════════════════ HEADER ════════════════════ */
.header {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 20px;
  margin: 12px 0 0;
  background: var(--header-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--glow-accent);
  transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
}

.logo-orb {
  width: 46px; height: 46px; flex-shrink: 0;
  border-radius: 50%;
  background: var(--btn-ask);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 0 20px rgba(99,136,255,0.4);
  animation: orbFloat 4s ease-in-out infinite;
  position: relative;
}
.logo-orb::after {
  content:'';
  position:absolute; inset:-3px;
  border-radius:50%;
  border:2px solid transparent;
  background: linear-gradient(135deg,var(--accent1),var(--accent2)) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: destination-out;
  mask-composite: exclude;
  animation: orbSpin 6s linear infinite;
}
@keyframes orbFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@keyframes orbSpin{to{transform:rotate(360deg);}}

.header-text { flex:1; min-width:0; }
.header-title {
  font-size: 18px; font-weight: 800; letter-spacing: -0.3px;
  background: linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; font-weight: 500; }

/* Class selector pills */
.class-selector {
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
.class-label { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; }
.class-pill-wrap {
  display: flex; gap: 4px; flex-wrap: nowrap;
}
.class-pill {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px; font-weight: 700;
  cursor: pointer; border: 1px solid var(--border);
  background: transparent; color: var(--text-secondary);
  transition: all 0.2s var(--ease-spring);
  white-space: nowrap;
}
.class-pill:hover { border-color: var(--accent1); color: var(--accent1); }
.class-pill.active {
  background: var(--btn-ask); color: #fff; border-color: transparent;
  box-shadow: 0 0 12px rgba(99,136,255,0.4);
  transform: scale(1.05);
}

/* status + theme btn */
.header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.status-badge {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  border-radius: 20px;
  background: var(--bg-layer3);
  border: 1px solid var(--border);
  font-size: 11px; font-weight: 700; color: var(--text-secondary);
  transition: all 0.3s;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-muted); transition: background 0.3s;
}
.status-badge.connected .status-dot { background: var(--accent3); box-shadow: 0 0 6px var(--accent3); }
.status-badge.listening .status-dot { background: var(--accent4); box-shadow: 0 0 6px var(--accent4); animation: blink 1s ease-in-out infinite; }
.status-badge.speaking  .status-dot { background: var(--accent1); box-shadow: 0 0 6px var(--accent1); animation: blink 0.7s ease-in-out infinite; }
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

.theme-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--bg-layer2); border: 1px solid var(--border);
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s var(--ease-spring);
  color: var(--text-primary);
}
.theme-btn:hover { transform: scale(1.1) rotate(20deg); border-color: var(--accent1); }

/* ════════════════════ CHAT AREA ════════════════════ */
.chat-wrap {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 16px 0;
}

.chat-container {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 4px 4px 8px;
  scroll-behavior: smooth;
}
.chat-container::-webkit-scrollbar { width: 3px; }
.chat-container::-webkit-scrollbar-track { background: transparent; }
.chat-container::-webkit-scrollbar-thumb {
  background: var(--border); border-radius: 3px;
}

/* ── Welcome screen ── */
.welcome {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; flex: 1;
  gap: 20px; text-align: center;
  animation: fadeUp 0.7s var(--ease-out);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

.welcome-orb {
  width: 100px; height: 100px; border-radius: 50%;
  background: var(--btn-ask);
  display: flex; align-items: center; justify-content: center;
  font-size: 48px;
  box-shadow: 0 0 60px rgba(99,136,255,0.4), 0 0 120px rgba(99,136,255,0.15);
  animation: orbFloat 3s ease-in-out infinite;
  position: relative;
}
.welcome-orb::before {
  content:'';
  position: absolute; inset:-8px; border-radius: 50%;
  border: 1.5px solid var(--border-glow);
  animation: orbSpin 8s linear infinite;
}
.welcome-orb::after {
  content:'';
  position: absolute; inset:-18px; border-radius: 50%;
  border: 1px solid var(--border);
  animation: orbSpin 14s linear infinite reverse;
}

.welcome-title {
  font-size: 32px; font-weight: 800; letter-spacing: -0.5px;
  background: linear-gradient(135deg,var(--accent1) 0%,var(--accent2) 50%,var(--accent3) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.welcome-sub {
  font-size: 15px; color: var(--text-secondary); max-width: 400px; line-height: 1.65;
}

/* Class topics grid */
.topics-section { width: 100%; max-width: 620px; }
.topics-class-label {
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  color: var(--text-muted); text-transform: uppercase;
  margin-bottom: 10px; text-align: left;
}
.topics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
}
.topic-card {
  background: var(--bg-layer1);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s var(--ease-spring);
  display: flex; flex-direction: column; gap: 4px;
}
.topic-card:hover {
  border-color: var(--accent1);
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(99,136,255,0.2);
}
.topic-card:active { transform: scale(0.97); }
.topic-icon { font-size: 22px; }
.topic-name { font-size: 12px; font-weight: 700; color: var(--text-primary); }
.topic-hint { font-size: 10px; color: var(--text-muted); }

/* ── Chat bubbles ── */
.bubble-row {
  display: flex; gap: 10px;
  animation: fadeUp 0.35s var(--ease-out);
}
.bubble-row.user  { flex-direction: row-reverse; }
.bubble-row.agent { flex-direction: row; }

.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; align-self: flex-end;
  border: 1.5px solid var(--border);
  background: var(--bg-layer2);
}
.bubble-row.agent .avatar {
  background: var(--btn-ask);
  box-shadow: 0 0 12px rgba(99,136,255,0.3);
}

.bubble {
  max-width: 68%;
  padding: 13px 18px;
  border-radius: var(--radius-md);
  font-size: 14px; line-height: 1.65; font-weight: 400;
  position: relative; word-wrap: break-word;
}
.bubble-row.user .bubble {
  background: var(--user-bubble);
  color: #fff; font-weight: 500;
  border-bottom-right-radius: 5px;
  box-shadow: 0 4px 20px rgba(99,136,255,0.3);
}
.bubble-row.agent .bubble {
  background: var(--agent-bubble);
  color: var(--text-primary);
  border: 1px solid var(--agent-border);
  border-bottom-left-radius: 5px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
.bubble-meta {
  font-size: 10px; color: var(--text-muted);
  margin-top: 4px; font-weight: 500;
}
.bubble-row.user  .bubble-meta { text-align: right; }

/* typing */
.typing-dots { display: flex; gap: 5px; align-items: center; padding: 6px 2px; }
.typing-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent1); opacity: 0.6;
  animation: typeBounce 1.1s ease-in-out infinite;
}
.typing-dot:nth-child(2){animation-delay:.18s;}
.typing-dot:nth-child(3){animation-delay:.36s;}
@keyframes typeBounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-8px);opacity:1;}}

/* ════════════════════ CONTROLS ════════════════════ */
.controls-wrap {
  padding: 0 0 16px;
  display: flex; flex-direction: column; gap: 10px;
}

/* Waveform visualizer */
.waveform {
  display: flex; align-items: center; justify-content: center;
  gap: 3px; height: 36px;
  opacity: 0; transition: opacity 0.4s;
}
.waveform.active { opacity: 1; }
.wave-bar {
  width: 3px; border-radius: 3px; min-height: 3px;
  background: linear-gradient(to top, var(--accent1), var(--accent2));
  transition: height 0.08s ease;
}

/* Input row */
.input-row { display: flex; gap: 10px; align-items: center; }

.text-input {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 14px 22px;
  font-family: var(--font-main);
  font-size: 14px; font-weight: 500;
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.4s;
  backdrop-filter: blur(10px);
}
.text-input:focus {
  border-color: var(--accent1);
  box-shadow: 0 0 0 3px rgba(99,136,255,0.15), var(--glow-accent);
}
.text-input::placeholder { color: var(--text-muted); }

.ask-btn {
  width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
  border: none; cursor: pointer;
  background: var(--btn-ask);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 4px 20px rgba(99,136,255,0.45);
  transition: all 0.2s var(--ease-spring);
  position: relative; overflow: hidden;
}
.ask-btn::before {
  content:'';
  position: absolute; inset: 0; border-radius: 50%;
  background: rgba(255,255,255,0.15);
  transform: scale(0); transition: transform 0.3s;
}
.ask-btn:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(99,136,255,0.6); }
.ask-btn:hover::before { transform: scale(1); }
.ask-btn:active { transform: scale(0.94); }
.ask-btn.recording {
  background: var(--btn-stop);
  box-shadow: 0 4px 20px rgba(244,114,182,0.5);
  animation: recordPulse 1.5s ease-in-out infinite;
}
@keyframes recordPulse{
  0%,100%{box-shadow:0 4px 20px rgba(244,114,182,0.5);}
  50%{box-shadow:0 4px 40px rgba(244,114,182,0.8), 0 0 0 8px rgba(244,114,182,0.15);}
}

/* send on enter hint */
.hint-text {
  text-align: center; font-size: 11px; color: var(--text-muted);
  letter-spacing: 0.3px;
}

/* ── Toast ── */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--bg-layer3); border: 1px solid var(--border);
  color: var(--text-primary); padding: 10px 20px;
  border-radius: var(--radius-md); font-size: 13px; font-weight: 600;
  z-index: 999; opacity: 0; pointer-events: none;
  transition: opacity 0.3s, transform 0.3s; white-space: nowrap;
  box-shadow: var(--glow-accent); max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Responsive ── */
@media(max-width:600px){
  .header { flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
  .class-selector { width: 100%; overflow-x: auto; }
  .class-pill-wrap { flex-wrap: nowrap; }
  .welcome-title { font-size: 24px; }
  .topics-grid { grid-template-columns: repeat(auto-fill,minmax(110px,1fr)); }
  .bubble { max-width: 82%; font-size: 13px; }
  .header-right { margin-left: auto; }
}
@media(max-width:400px){
  .status-badge span { display: none; }
}
</style>
</head>
<body>

<!-- Star field -->
<div class="starfield" id="starfield" aria-hidden="true"></div>
<div class="nebula nebula-1"></div>
<div class="nebula nebula-2"></div>
<div class="nebula nebula-3"></div>

<div class="app">

  <!-- ══════════ HEADER ══════════ -->
  <header class="header">
    <div class="logo-orb" aria-hidden="true">🌟</div>

    <div class="header-text">
      <div class="header-title">EduStar AI Tutor</div>
      <div class="header-sub" id="headerSub">Select your class to begin</div>
    </div>

    <!-- Class selector: 1–10 -->
    <div class="class-selector" role="navigation" aria-label="Select class">
      <span class="class-label">CLASS</span>
      <div class="class-pill-wrap" id="classPills">
        <!-- injected by JS -->
      </div>
    </div>

    <div class="header-right">
      <div class="status-badge" id="statusBadge" role="status" aria-live="polite">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusLabel">Ready</span>
      </div>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle dark/light mode">☀️</button>
    </div>
  </header>

  <!-- ══════════ CHAT ══════════ -->
  <div class="chat-wrap">
    <div class="chat-container" id="chatContainer" aria-live="polite" aria-label="Conversation">

      <!-- Welcome screen (shown before connecting) -->
      <div class="welcome" id="welcomeScreen">
        <div class="welcome-orb" aria-hidden="true">🤖</div>
        <div>
          <div class="welcome-title">Hello, Future Star! ✨</div>
          <div class="welcome-sub" id="welcomeSub">
            I'm your AI Tutor — ready to help with <strong>anything</strong>.<br/>
            Pick your class above, then tap <strong>Ask Me</strong> to start!
          </div>
        </div>
        <div class="topics-section" id="topicsSection">
          <div class="topics-class-label" id="topicsLabel">Choose a topic to explore</div>
          <div class="topics-grid" id="topicsGrid">
            <!-- injected by JS based on selected class -->
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ══════════ CONTROLS ══════════ -->
  <div class="controls-wrap">
    <div class="waveform" id="waveform" aria-hidden="true">
      <!-- bars injected by JS -->
    </div>
    <div class="input-row">
      <input
        type="text"
        class="text-input"
        id="textInput"
        placeholder="Ask anything… press Enter or tap the button 🚀"
        aria-label="Type your question"
        autocomplete="off"
      />
      <button class="ask-btn" id="askBtn" aria-label="Start voice session">🎙️</button>
    </div>
    <div class="hint-text">Press <kbd style="background:var(--bg-layer3);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:10px;">Enter</kbd> to send · <kbd style="background:var(--bg-layer3);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:10px;">Space</kbd> to toggle mic</div>
  </div>

</div><!-- /.app -->

<div class="toast" id="toast" role="alert"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   EduStar — connects your browser to tutor_agent.py via server.py
   Variables: LIVEKIT_URL, LIVEKIT_API_KEY from your .env
   Token is signed server-side (server.py /api/token)
═══════════════════════════════════════════════════════════════ */

const SERVER = window.location.origin;

/* ─── Class topics data ─────────────────────────────────────── */
const CLASS_TOPICS = {

const CLASS_NAMES = {
  1:'Tiny Explorer',2:'Little Learner',3:'Curious Kid',4:'Young Scholar',
  5:'Knowledge Seeker',6:'Rising Star',7:'Smart Thinker',8:'Bright Mind',
  9:'Achiever',10:'Board Champion'
};

/* ─── State ──────────────────────────────────────────────── */
let room = null;
let isConnected = false;
let selectedClass = 5;
let isDark = true;
let micStream = null;
let audioCtx = null;
let analyser = null;
let vizRaf = null;

/* ─── DOM refs ───────────────────────────────────────────── */
const chatContainer  = document.getElementById('chatContainer');
const textInput      = document.getElementById('textInput');
const askBtn         = document.getElementById('askBtn');
const statusBadge    = document.getElementById('statusBadge');
const statusDot      = document.getElementById('statusDot');
const statusLabel    = document.getElementById('statusLabel');
const waveform       = document.getElementById('waveform');
const toast          = document.getElementById('toast');
const themeBtn       = document.getElementById('themeBtn');
const classPillsEl   = document.getElementById('classPills');
const topicsGrid     = document.getElementById('topicsGrid');
const topicsLabel    = document.getElementById('topicsLabel');
const welcomeSub     = document.getElementById('welcomeSub');
const headerSub      = document.getElementById('headerSub');
const starfield      = document.getElementById('starfield');

/* ─── Stars ──────────────────────────────────────────────── */
(function buildStars(){
  for(let i=0;i<120;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = 1 + Math.random()*2.5;
    s.style.cssText = `
      width:${size}px;height:${size}px;
      top:${Math.random()*100}%;left:${Math.random()*100}%;
      animation-duration:${2+Math.random()*4}s;
      animation-delay:${Math.random()*4}s;
    `;
    starfield.appendChild(s);
  }
})();

/* ─── Waveform bars ─────────────────────────────────────── */
(function buildWave(){
  for(let i=0;i<24;i++){
    const b = document.createElement('div');
    b.className = 'wave-bar';
    b.style.height = '3px';
    b.style.animationDelay = `${i*0.06}s`;
    waveform.appendChild(b);
  }
})();

/* ─── Class pills ────────────────────────────────────────── */
function buildClassPills(){
  classPillsEl.innerHTML = '';
  for(let c=1;c<=10;c++){
    const btn = document.createElement('button');
    btn.className = 'class-pill' + (c===selectedClass?' active':'');
    btn.textContent = c;
    btn.setAttribute('aria-label', `Class ${c}`);
    btn.addEventListener('click', ()=>selectClass(c));
    classPillsEl.appendChild(btn);
  }
}

function selectClass(c){
  selectedClass = c;
  buildClassPills();
  buildTopics();
  headerSub.textContent = `Class ${c} · ${CLASS_NAMES[c]}`;
  welcomeSub.innerHTML = `I'm your AI Tutor for <strong>Class ${c}</strong> — ${CLASS_NAMES[c]}!<br/>Pick a topic below or ask me anything.`;
  textInput.placeholder = `Ask anything for Class ${c}… 🚀`;
}

function buildTopics(){
  const topics = CLASS_TOPICS[selectedClass] || [];
  topicsLabel.textContent = `Class ${selectedClass} topics — tap to ask`;
  topicsGrid.innerHTML = '';
  topics.forEach(t => {
    const card = document.createElement('div');
    card.className = 'topic-card';
    card.setAttribute('role','button');
    card.setAttribute('tabindex','0');
    card.setAttribute('aria-label', `Ask about ${t.n}`);
    card.innerHTML = `<div class="topic-icon">${t.i}</div><div class="topic-name">${t.n}</div><div class="topic-hint">${t.h}</div>`;
    card.addEventListener('click', ()=>{
      textInput.value = `Explain ${t.n} for Class ${selectedClass} students`;
      textInput.focus();
    });
    card.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') card.click(); });
    topicsGrid.appendChild(card);
  });
}

/* ─── Theme toggle ─────────────────────────────────────── */
themeBtn.addEventListener('click', ()=>{
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark?'dark':'light');
  themeBtn.textContent = isDark ? '☀️' : '🌙';
  themeBtn.setAttribute('aria-label', isDark?'Switch to light mode':'Switch to dark mode');
});

/* ─── Status helpers ─────────────────────────────────────── */
function setStatus(state, label){
  statusBadge.className = 'status-badge ' + state;
  statusLabel.textContent = label;
}

/* ─── Toast ──────────────────────────────────────────────── */
let toastTimer;
function showToast(msg, ms=3800){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'), ms);
}

/* ─── Chat bubble helpers ────────────────────────────────── */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function timeNow(){ return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }

function hideWelcome(){
  const w = document.getElementById('welcomeScreen');
  if(w){ w.style.transition='opacity 0.4s'; w.style.opacity='0'; setTimeout(()=>w.remove(),400); }
}

function addBubble(role, text){
  hideWelcome();
  const row = document.createElement('div');
  row.className = `bubble-row ${role}`;
  const isUser = role==='user';
  row.innerHTML = `
    <div class="avatar" aria-hidden="true">${isUser?'🎓':'🤖'}</div>
    <div>
      <div class="bubble" role="article" aria-label="${isUser?'You':'Tutor'}: ${esc(text)}">${esc(text)}</div>
      <div class="bubble-meta">${isUser?'You':'Tutor'} · ${timeNow()}</div>
    </div>`;
  chatContainer.appendChild(row);
  chatContainer.scrollTo({top:chatContainer.scrollHeight,behavior:'smooth'});
  return row;
}

function showTyping(){
  hideWelcome();
  const row = document.createElement('div');
  row.className='bubble-row agent'; row.id='typingRow';
  row.innerHTML=`<div class="avatar" aria-hidden="true">🤖</div>
    <div><div class="bubble" aria-label="Tutor is thinking">
      <div class="typing-dots">
        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
      </div>
    </div></div>`;
  chatContainer.appendChild(row);
  chatContainer.scrollTo({top:chatContainer.scrollHeight,behavior:'smooth'});
}
function removeTyping(){ const el=document.getElementById('typingRow'); if(el)el.remove(); }

/* ─── Mic visualizer ─────────────────────────────────────── */
async function startViz(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx  = new (window.AudioContext||window.webkitAudioContext)();
    analyser  = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
    waveform.classList.add('active');
    const bars = waveform.querySelectorAll('.wave-bar');
    const data = new Uint8Array(analyser.frequencyBinCount);
    function draw(){
      vizRaf = requestAnimationFrame(draw);
      analyser.getByteFrequencyData(data);
      bars.forEach((b,i)=>{
        const v = data[i*2]||0;
        b.style.height = (3+(v/255)*32)+'px';
      });
    }
    draw();
  }catch(e){ console.warn('viz:',e); }
}
function stopViz(){
  if(vizRaf){cancelAnimationFrame(vizRaf);vizRaf=null;}
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}
  if(audioCtx){audioCtx.close();audioCtx=null;}
  waveform.classList.remove('active');
  waveform.querySelectorAll('.wave-bar').forEach(b=>b.style.height='3px');
}

/* ─── LiveKit connection ─────────────────────────────────── */
async function connect(){
  if(isConnected) return;
  setStatus('','Connecting…');
  askBtn.textContent='⏳'; askBtn.disabled=true;

  try{
    // Fetch signed token from server.py
    // server.py reads LIVEKIT_URL + LIVEKIT_API_KEY + LIVEKIT_API_SECRET from your .env
    const res = await fetch(`${SERVER}/api/token`);
    if(!res.ok) throw new Error(`Token error: ${res.statusText}`);
    const {token, url, room: roomName} = await res.json();

    room = new LivekitClient.Room({adaptiveStream:true, dynacast:true});

    room
      .on(LivekitClient.RoomEvent.Connected,           onConnected)
      .on(LivekitClient.RoomEvent.Disconnected,        onDisconnected)
      .on(LivekitClient.RoomEvent.TrackSubscribed,     onTrackSubscribed)
      .on(LivekitClient.RoomEvent.DataReceived,        onDataReceived)
      .on(LivekitClient.RoomEvent.ParticipantConnected,onAgentJoined)
      .on(LivekitClient.RoomEvent.ActiveSpeakersChanged, onSpeakers);

    await room.connect(url, token, {autoSubscribe:true});

    // Pass class context to agent via initial data message
    await room.localParticipant.setMicrophoneEnabled(true);
    await startViz();

    // Tell agent which class the student is
    const enc = new TextEncoder();
    try{
      await room.localParticipant.publishData(
        enc.encode(JSON.stringify({type:'class_info', class:selectedClass, className:CLASS_NAMES[selectedClass]})),
        {reliable:true}
      );
    }catch(e){console.warn('class_info send:',e);}

  }catch(err){
    console.error('connect:',err);
    setStatus('','Ready');
    askBtn.textContent='🎙️'; askBtn.disabled=false;
    showToast('⚠️ Could not connect. Is server.py running?\n'+err.message, 5000);
  }
}

function onConnected(){
  isConnected=true;
  setStatus('listening','Listening…');
  askBtn.textContent='⏹️'; askBtn.classList.add('recording'); askBtn.disabled=false;
  askBtn.setAttribute('aria-label','Stop voice session');
}
function onDisconnected(){
  isConnected=false;
  setStatus('','Ready');
  askBtn.textContent='🎙️'; askBtn.classList.remove('recording'); askBtn.disabled=false;
  askBtn.setAttribute('aria-label','Start voice session');
  stopViz(); removeTyping(); room=null;
}
function onAgentJoined(p){
  console.log('Agent joined:',p.identity);
  setStatus('connected','Tutor ready');
}
function onTrackSubscribed(track,pub,participant){
  if(track.kind===LivekitClient.Track.Kind.Audio){
    const el = track.attach();
    el.autoplay=true; el.style.display='none';
    document.body.appendChild(el);
    setStatus('speaking','Tutor speaking…');
  }
}
function onSpeakers(speakers){
  const agentTalking = speakers.some(p=>p.identity!==room?.localParticipant?.identity);
  if(agentTalking) setStatus('speaking','Tutor speaking…');
  else if(isConnected) setStatus('listening','Listening…');
}

/* ─── DataChannel: receive transcripts from tutor_agent.py ── */
function onDataReceived(payload, participant){
  try{
    const msg = JSON.parse(new TextDecoder().decode(payload));
    removeTyping();
    if(msg.type==='user_transcript') { addBubble('user',msg.text); showTyping(); }
    else if(msg.type==='agent_response') { addBubble('agent',msg.text); }
    else if(msg.type==='agent_thinking') { showTyping(); }
  }catch(e){
    const text = new TextDecoder().decode(payload).trim();
    if(text){ removeTyping(); addBubble('agent',text); }
  }
}

/* ─── Text send ──────────────────────────────────────────── */
async function sendText(){
  const q = textInput.value.trim();
  if(!q) return;
  textInput.value='';
  addBubble('user',q);
  showTyping();

  if(!isConnected) await connect();

  if(room && isConnected){
    try{
      const enc = new TextEncoder();
      await room.localParticipant.publishData(
        enc.encode(JSON.stringify({type:'user_text', text:q, class:selectedClass})),
        {reliable:true}
      );
    }catch(e){ console.warn('send:',e); }
  }
}

/* ─── Button & keyboard ──────────────────────────────────── */
askBtn.addEventListener('click', async ()=>{
  if(isConnected){ if(room) await room.disconnect(); }
  else await connect();
});
textInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendText(); }
});
document.addEventListener('keydown', e=>{
  if(e.code==='Space'&&document.activeElement!==textInput){ e.preventDefault(); askBtn.click(); }
});

/* ─── Init ───────────────────────────────────────────────── */
buildClassPills();
selectClass(5);  // default class 5

(async function healthCheck(){
  try{
    const r = await fetch(`${SERVER}/api/health`);
    if(r.ok){ const d=await r.json(); console.log('Server ok:',d); setStatus('connected','Server ready'); setTimeout(()=>setStatus('','Ready'),2500); }
    else showToast('⚠️ server.py responded with error',5000);
  }catch(e){
    setStatus('','Offline');
    showToast('🔌 Start server.py first: python server.py',6000);
  }
})();
</script>
